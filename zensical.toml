[project]
site_name = "ORION Documentation"
site_url = "https://MarcoGrossi92.github.io/ORION/"
site_description = "Documentation for ORION - Ordinary Repository for Input-Output Necessities"
site_author = "Marco Grossi"

copyright = "Copyright &copy; 2024 Marco Grossi"

repo_url = "https://github.com/MarcoGrossi92/ORION"
repo_name = "MarcoGrossi92/ORION"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "User Guide" = [
    "user-guide/index.md",
    { "Supported Formats" = "user-guide/supported-formats.md" },
    { "Command-line Converter" = "user-guide/converter.md" },
    { "Fortran API" = "user-guide/fortran-api.md" },
    { "Python API" = "user-guide/python-api.md" },
  ] },
  { "Developer Guide" = [
    "development/index.md",
    { "Contributing" = "development/contributing.md" },
    { "Versioning" = "development/versioning.md" },
  ] },
  { "About" = [
    "about/index.md",
    { "Acknowledgements" = "about/acknowledgements.md" },
    { "License" = "about/license.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "cyan"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "cyan"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MarcoGrossi92/ORION"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
