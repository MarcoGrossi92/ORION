name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and run CTest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            g++ \
            libboost-all-dev \
            python3-numpy

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_TECIO=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --timeout 120